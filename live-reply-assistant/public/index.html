<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Reply Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5d6470; --line: #e3e6eb;
    --accent: #2457d6; --accent-text: #ffffff; --say-bg: #eef3ff; --say-line: #c9d8ff;
    --danger: #c62f2f; --ok: #1d8a4e; --note: #8a5a00; --note-bg: #fff7e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216; --panel: #181b21; --text: #eceef2; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #5b8cff; --accent-text: #0b0d12; --say-bg: #18233d; --say-line: #2c4277;
      --danger: #ff6b6b; --ok: #4cd18a; --note: #ffcc66; --note-bg: #2a2416;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  select, textarea, input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 110px; resize: vertical; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.stop { background: var(--danger); color: #fff; border-color: var(--danger); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .big { font-size: 18px; padding: 12px 22px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .docs { list-style: none; padding: 0; margin: 8px 0 0; }
  .docs li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .docs li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .docs button { padding: 2px 8px; font-size: 12px; }
  .status { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--danger); animation: pulse 1.2s infinite; }
  .dot.paused { background: var(--note); }
  @keyframes pulse { 50% { opacity: .3; } }
  .live-line { min-height: 24px; margin: 10px 0; color: var(--muted); font-style: italic; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; background: var(--panel); }
  .card .heard-raw { font-size: 13px; color: var(--muted); }
  .card .heard { margin: 4px 0 10px; }
  .card .say { background: var(--say-bg); border: 1px solid var(--say-line); border-radius: 10px; padding: 12px 14px; font-size: 21px; line-height: 1.45; font-weight: 500; }
  .card .theirs { margin-top: 8px; padding: 8px 12px; border-left: 3px solid var(--say-line); color: var(--muted); }
  .card .note { margin-top: 8px; font-size: 14px; color: var(--note); background: var(--note-bg); border-radius: 8px; padding: 6px 10px; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { color: var(--danger); font-size: 14px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; }
  #feed:empty::before { content: "Press Start and let the other person talk. Their words and your reply will appear here."; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Live Reply Assistant</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">Not listening</span></div>
  <button id="startBtn" class="primary big">Start</button>
  <button id="pauseBtn" disabled title="Press while you are talking so your own voice is ignored (shortcut: Space)">I'm talking</button>
  <button id="stopBtn" class="stop big" disabled>Stop</button>
</header>

<div class="wrap">
  <aside>
    <div class="panel">
      <h2>Languages</h2>
      <label for="theirLang">They speak</label>
      <select id="theirLang"></select>
      <label for="myLang">Show my reply in</label>
      <select id="myLang"></select>
      <label class="check"><input type="checkbox" id="showTheirs" /> Also show my reply in their language</label>
      <div id="speechWarn" class="warn" hidden>Live listening needs Chrome or Edge. You can still type what they said below.</div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Knowledge</h2>
      <label for="background">Background about you / your business</label>
      <textarea id="background" placeholder="e.g. I sell used cars. Best price for the 2019 Corolla is 9,500. I can deliver within 3 days..."></textarea>
      <div class="row" style="margin-top:8px">
        <button id="saveBg">Save background</button>
        <span id="bgSaved" class="muted"></span>
      </div>
      <label>Documents (PDF, Word, TXT, CSV)</label>
      <div class="row">
        <button id="browseBtn">Browse files…</button>
        <input id="fileInput" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.json" hidden />
        <span id="uploadMsg" class="muted"></span>
      </div>
      <ul id="docs" class="docs"></ul>
    </div>
  </aside>

  <main class="panel">
    <h2>Conversation</h2>
    <div id="liveLine" class="live-line"></div>
    <div class="row">
      <input type="text" id="manualInput" placeholder="Or type / paste what they said and press Enter" style="flex:1" />
      <button id="manualBtn">Get reply</button>
      <button id="clearBtn" title="Clear the conversation">Clear</button>
    </div>
    <div id="feed" style="margin-top:14px"></div>
  </main>
</div>

<script>
const LANGS = [
  ["en-US","English"],["hi-IN","Hindi"],["te-IN","Telugu"],["ta-IN","Tamil"],["kn-IN","Kannada"],["ml-IN","Malayalam"],
  ["mr-IN","Marathi"],["bn-IN","Bengali"],["gu-IN","Gujarati"],["pa-IN","Punjabi"],["ur-PK","Urdu"],
  ["es-ES","Spanish"],["fr-FR","French"],["de-DE","German"],["it-IT","Italian"],["pt-BR","Portuguese"],["ru-RU","Russian"],
  ["ar-SA","Arabic"],["tr-TR","Turkish"],["zh-CN","Chinese (Mandarin)"],["ja-JP","Japanese"],["ko-KR","Korean"],
  ["vi-VN","Vietnamese"],["th-TH","Thai"],["id-ID","Indonesian"],["nl-NL","Dutch"],["pl-PL","Polish"],["uk-UA","Ukrainian"]
];
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

for (const [code, name] of LANGS) {
  $("theirLang").add(new Option(name, code));
  $("myLang").add(new Option(name, name));
}
$("theirLang").value = store.get("theirLang", "hi-IN");
$("myLang").value = store.get("myLang", "English");
$("showTheirs").checked = store.get("showTheirs", "0") === "1";
$("theirLang").onchange = () => { store.set("theirLang", $("theirLang").value); if (listening) restartRecognition(); };
$("myLang").onchange = () => store.set("myLang", $("myLang").value);
$("showTheirs").onchange = () => store.set("showTheirs", $("showTheirs").checked ? "1" : "0");

// ---------- Knowledge base ----------
async function loadKnowledge() {
  const r = await fetch("/api/knowledge"); const kb = await r.json();
  $("background").value = kb.background || "";
  renderDocs(kb.documents);
}
function renderDocs(docs) {
  $("docs").innerHTML = "";
  if (!docs.length) { $("docs").innerHTML = '<li class="muted">No documents yet</li>'; return; }
  for (const d of docs) {
    const li = document.createElement("li");
    const s = document.createElement("span"); s.textContent = d.name; s.title = `${d.name} (${d.chars.toLocaleString()} characters)`;
    const b = document.createElement("button"); b.textContent = "Remove";
    b.onclick = async () => { await fetch(`/api/documents/${d.id}`, { method: "DELETE" }); loadKnowledge(); };
    li.append(s, b); $("docs").append(li);
  }
}
$("saveBg").onclick = async () => {
  await fetch("/api/background", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ background: $("background").value }) });
  $("bgSaved").textContent = "Saved"; setTimeout(() => $("bgSaved").textContent = "", 2000);
};
$("browseBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async () => {
  const files = [...$("fileInput").files]; if (!files.length) return;
  const fd = new FormData(); files.forEach(f => fd.append("files", f));
  $("uploadMsg").textContent = "Reading files…";
  try {
    const r = await fetch("/api/upload", { method: "POST", body: fd }); const out = await r.json();
    $("uploadMsg").textContent = `${out.added.length} added` + (out.failed.length ? `, ${out.failed.length} failed: ${out.failed.map(f => f.name + " – " + f.error).join("; ")}` : "");
  } catch { $("uploadMsg").textContent = "Upload failed"; }
  $("fileInput").value = ""; loadKnowledge();
};

// ---------- Conversation ----------
const history = []; // {heard, reply}
const queue = [];
let busy = false;
let currentAbort = null;

function parseSections(text) {
  const out = { "THEY SAID": "", "YOU SAY": "", "IN THEIR LANGUAGE": "", "NOTE": "" };
  const re = /^###\s*(THEY SAID|YOU SAY|IN THEIR LANGUAGE|NOTE)\s*$/gm;
  const marks = [...text.matchAll(re)];
  if (!marks.length) { out["YOU SAY"] = text.trim(); return out; }
  marks.forEach((m, i) => {
    const end = i + 1 < marks.length ? marks[i + 1].index : text.length;
    out[m[1]] = text.slice(m.index + m[0].length, end).trim();
  });
  return out;
}
const clean = (s) => s.replace(/^<.*>$/s, "").trim();

function makeCard(raw) {
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = `<div class="heard-raw"></div><div class="tag" style="margin-top:6px">They said</div><div class="heard muted">…</div>
    <div class="tag">You say</div><div class="say">…</div><div class="theirs" hidden></div><div class="note" hidden></div>`;
  card.querySelector(".heard-raw").textContent = "Heard: " + raw;
  $("feed").prepend(card);
  return card;
}
function fillCard(card, text) {
  const s = parseSections(text);
  card.querySelector(".heard").textContent = clean(s["THEY SAID"]) || "…";
  card.querySelector(".say").textContent = clean(s["YOU SAY"]) || "…";
  const t = clean(s["IN THEIR LANGUAGE"]); const th = card.querySelector(".theirs");
  th.hidden = !t; th.textContent = t;
  const n = clean(s["NOTE"]); const no = card.querySelector(".note");
  no.hidden = !n; no.textContent = n;
}

function enqueue(utterance) {
  utterance = utterance.trim(); if (!utterance) return;
  queue.push(utterance); pump();
}
async function pump() {
  if (busy || !queue.length) return;
  busy = true;
  // Merge anything that piled up while the previous reply was being written.
  const utterance = queue.splice(0).join(" ");
  const card = makeCard(utterance);
  let text = "";
  currentAbort = new AbortController();
  try {
    const r = await fetch("/api/respond", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: currentAbort.signal,
      body: JSON.stringify({
        utterance, history,
        replyLanguage: $("myLang").value,
        theirLanguage: $("theirLang").selectedOptions[0].text,
        showInTheirLanguage: $("showTheirs").checked,
      }),
    });
    const reader = r.body.getReader(); const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      text += dec.decode(value, { stream: true }); fillCard(card, text);
    }
    fillCard(card, text);
    history.push({ heard: utterance, reply: text });
    if (history.length > 20) history.shift();
  } catch (e) {
    if (e.name !== "AbortError") fillCard(card, "### NOTE\nCould not reach the server.");
    else fillCard(card, text + "\n### NOTE\nStopped.");
  } finally {
    busy = false; currentAbort = null; pump();
  }
}
$("manualBtn").onclick = () => { enqueue($("manualInput").value); $("manualInput").value = ""; };
$("manualInput").onkeydown = (e) => { if (e.key === "Enter") $("manualBtn").click(); };
$("clearBtn").onclick = () => { history.length = 0; $("feed").innerHTML = ""; };

// ---------- Listening (browser speech recognition) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { $("speechWarn").hidden = false; $("startBtn").disabled = true; }

let recognition = null, listening = false, paused = false;
let buffer = "", silenceTimer = null;
const SILENCE_MS = 1300; // send after this much quiet

function setStatus(state) {
  $("dot").className = "dot" + (state === "live" ? " live" : state === "paused" ? " paused" : "");
  $("statusText").textContent = state === "live" ? "Listening to them…" : state === "paused" ? "Paused (you are talking)" : "Not listening";
}
function flush() {
  clearTimeout(silenceTimer);
  if (buffer.trim()) enqueue(buffer);
  buffer = ""; $("liveLine").textContent = "";
}
function startRecognition() {
  recognition = new SR();
  recognition.lang = $("theirLang").value;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = (e) => {
    if (paused) return;
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) buffer += " " + r[0].transcript; else interim += r[0].transcript;
    }
    $("liveLine").textContent = (buffer + " " + interim).trim();
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(flush, SILENCE_MS);
  };
  recognition.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      alert("Microphone access was blocked. Allow the microphone for this site and try again. (Hosted sites must use https.)");
      stopAll();
    }
  };
  // Chrome ends recognition on its own every so often; keep it going while listening.
  recognition.onend = () => { if (listening) { try { recognition.start(); } catch {} } };
  recognition.start();
}
function restartRecognition() { if (recognition) { recognition.onend = null; recognition.abort(); } startRecognition(); }

function startAll() {
  listening = true; paused = false;
  startRecognition();
  setStatus("live");
  $("startBtn").disabled = true; $("stopBtn").disabled = false; $("pauseBtn").disabled = false;
  $("pauseBtn").textContent = "I'm talking";
}
function stopAll() {
  listening = false; paused = false;
  if (recognition) { recognition.onend = null; try { recognition.abort(); } catch {} recognition = null; }
  clearTimeout(silenceTimer); buffer = ""; $("liveLine").textContent = "";
  queue.length = 0;
  if (currentAbort) currentAbort.abort();
  setStatus("off");
  $("startBtn").disabled = !SR; $("stopBtn").disabled = true; $("pauseBtn").disabled = true;
}
function togglePause() {
  if (!listening) return;
  paused = !paused;
  if (paused) { flush(); setStatus("paused"); $("pauseBtn").textContent = "Done talking"; }
  else { buffer = ""; setStatus("live"); $("pauseBtn").textContent = "I'm talking"; }
}
$("startBtn").onclick = startAll;
$("stopBtn").onclick = stopAll;
$("pauseBtn").onclick = togglePause;
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && listening && !["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(document.activeElement.tagName)) {
    e.preventDefault(); togglePause();
  }
});

loadKnowledge();
</script>
</body>
</html>
